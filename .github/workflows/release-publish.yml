name: Release Publish

# 维护接力版发布流程：
# 1) 手动触发（workflow_dispatch）或推送 v* tag 都会走同一套构建
# 2) 产出 Windows / Linux / Docker 三套包：
#    - NapCat.Shell.zip / NapCat.Framework.zip（Windows，也用于 WebUI 在线更新）
#    - NapCat.Shell.Linux.tar.gz（Linux，保留可执行权限）
#    - ghcr.io/<owner>/napcat:<tag>（Docker 镜像，失败不阻塞 Release）
# 3) 不再同步 Apifox / release hash / 下游仓库（依赖上游 secrets，维护仓库没有）
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g., v4.18.44)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

permissions: write-all

env:
  RELEASE_NAME: "NapCat"

jobs:
  build:
    name: Build NapCat.${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - name: Framework
            build_cmd: build:framework
            src_dir: packages/napcat-framework/dist
            dist_dir: framework-dist
          - name: Shell
            build_cmd: build:shell
            src_dir: packages/napcat-shell/dist
            dist_dir: shell-dist
    steps:
      - name: Clone Main Repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Use Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x
      - name: Build NapCat.${{ matrix.target.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAPCAT_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          pnpm i
          pnpm --filter napcat-webui-frontend run build || exit 1
          pnpm run ${{ matrix.target.build_cmd }}
          pnpm --filter napcat-plugin-builtin run build || exit 1
          mv ${{ matrix.target.src_dir }} ${{ matrix.target.dist_dir }}
          cd ${{ matrix.target.dist_dir }}
          # --omit=dev still resolves dev peer dependencies; remove build tooling first.
          npm pkg delete devDependencies
          npm install --omit=dev
          rm ./package-lock.json || exit 0
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: NapCat.${{ matrix.target.name }}
          path: ${{ matrix.target.dist_dir }}

  package-linux:
    name: Package NapCat.Shell.Linux
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Shell Artifact
        uses: actions/download-artifact@v7
        with:
          name: NapCat.Shell
          path: napcat-shell
      - name: Package Linux tarball
        run: |
          set -euo pipefail
          # tar.gz 保留可执行权限，Linux 下解压即用
          tar -czf NapCat.Shell.Linux.tar.gz -C napcat-shell .
          ls -lh NapCat.Shell.Linux.tar.gz
      - name: Upload Artifact
        uses: actions/upload-artifact@v6
        with:
          name: NapCat.Shell.Linux
          path: NapCat.Shell.Linux.tar.gz

  docker-image:
    name: Build Docker Image
    needs: [build]
    runs-on: ubuntu-latest
    # Docker 镜像依赖 Linux QQ 安装包，构建失败不影响 Release 产出
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
      - name: Download Shell Artifact
        uses: actions/download-artifact@v7
        with:
          name: NapCat.Shell
          path: napcat
      - name: Compute image name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/napcat" >> "$GITHUB_ENV"
          echo "VERSION=${{ github.event.inputs.version || github.ref_name }}" >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest

  release-napcat:
    needs: [build, package-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts

      - name: Zip Artifacts
        run: |
          set -euo pipefail
          cd artifacts
          [ -d NapCat.Framework ] && (cd NapCat.Framework && zip -qr ../../NapCat.Framework.zip .)
          [ -d NapCat.Shell ] && (cd NapCat.Shell && zip -qr ../../NapCat.Shell.zip .)
          cd ..
          cp artifacts/NapCat.Shell.Linux/NapCat.Shell.Linux.tar.gz ./NapCat.Shell.Linux.tar.gz
          ls -lh NapCat.*.zip NapCat.*.tar.gz

      - name: Use Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Generate release note
        env:
          CURRENT_TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if ! node .github/scripts/generate-release-notes.mjs "$CURRENT_TAG" "$GITHUB_REPOSITORY" CHANGELOG.md; then
            echo "自动生成更新日志失败，使用兜底内容" >&2
            printf '新增\n\n- 维护接力构建\n' > CHANGELOG.md
          fi
          cat >> CHANGELOG.md <<'EOF'

          ---

          ### 维护接力说明

          - 本 Release 由维护仓库构建：`NapCat.Shell.zip` / `NapCat.Framework.zip`（Windows）、`NapCat.Shell.Linux.tar.gz`（Linux）
          - Docker 镜像：`ghcr.io/exe-autumnwind/napcat:latest`（构建失败时本 Release 不含新镜像）
          - WebUI 的检查更新 / 版本列表 / 临时版本已指向本仓库
          EOF

      - name: Create Release and Upload Artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: NapCat ${{ github.event.inputs.version || github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            NapCat.Framework.zip
            NapCat.Shell.zip
            NapCat.Shell.Linux.tar.gz
          draft: false
